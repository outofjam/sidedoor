<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <label class="row switch">
    <span><strong>Sidedoor</strong></span>
    <input type="checkbox" id="enabled">
  </label>
  <label class="field">
    <span>Open X links with</span>
    <select id="viewer"></select>
  </label>
  <p class="muted small">Right-click any link to open the original on X or try another viewer.</p>
  <div class="popup-links">
    <a href="#" id="settings">Settings…</a>
    <a href="https://github.com/outofjam/sidedoor/issues" class="ext">Report a problem</a>
  </div>
  <div class="popup-credit muted small">Made by <a href="https://outofjam.com" class="ext">Out of Jam</a></div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
